version: 1
root: .
name: nvim
default_profile: full
output:
  dir: /home/darius/tmp/
  pattern: nvim_config_{profile}_{ts}_{gitsha}.md
  latest: ""
  stdout_default: false
render:
  format: md
  newline: |4+
  code_fences: true
  include_tree: true
  tree_depth: 5
  include_manifest: true
  manifest:
    group_by_slice: true
    include_line_counts: true
    include_byte_counts: true
    include_truncation_notes: true
    include_unreadable_notes: true
  file_block:
    header: "===== FILE: {path} ====="
    footer: ""
budgets:
  max_chars: 1000000
  per_file_max_lines: 600
  per_file_max_bytes: 262144
  drop_policy: drop_low_priority
ignore:
  use_gitignore: true
  always:
    - .git/**
    - node_modules/**
    - dist/**
    - build/**
    - .venv/**
    - .pytest_cache/**
    - coverage/**
    - target/**
    - .snip/**
  binary_extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .pdf
    - .zip
    - .tar
    - .gz
    - .7z
    - .exe
    - .dll
    - .so
    - .dylib
sensitive:
  exclude_globs:
    - .env*
    - "**/*secret*"
    - "**/*secrets*"
    - "**/*.pem"
    - "**/*.key"
    - "**/id_rsa*"
    - "**/*serviceAccount*.json"
slices:
  plugins:
    include:
      - "lua/plugins/**.lua"
    exclude: []
    priority: 100
  configs:
    include:
      - "lua/config/**.lua"
    exclude: []
    priority: 90
  docs:
    include:
      - README*
    exclude: []
    priority: 20
  lua:
    include:
      - "**/*.lua"
    exclude: []
    priority: 40
profiles:
  full:
    enable:
      #- configs
      #- plugins
      #- docs
      - lua
    budgets:
      max_chars: 220000
    render:
      tree_depth: 5
  minimal:
    enable:
      - plugins
      - configs
    budgets:
      max_chars: 80000
    render:
      tree_depth: 3
  plugins:
    enable:
      - plugins
    budgets:
      max_chars: 120000
    render:
      tree_depth: 4
